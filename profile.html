<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="referrer" content="no-referrer">
    <title>Wells Fargo Mobile - Profile</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preload" as="image" href="images/melissa.png" type="image/png" fetchpriority="high">
    <link rel="preload" as="image" href="images/lynda.png" type="image/png">
    <link rel="preload" as="image" href="images/vivian.jpg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="app.js?v=vivian6"></script>
</head>
<body class="wf-subpage-body">
    <div class="container wf-subpage-container">
        <header class="wf-red-header">
            <div class="wf-red-title" data-user-name></div>
        </header>

        <main class="wf-subpage-main">
            <div class="wf-profile-card">
                <div class="wf-profile-title">Your profile</div>
                <div class="wf-profile-photo">
                    <button type="button" class="wf-profile-photo-btn" id="profilePhotoBtn" aria-label="View profile photo">
                        <img class="wf-profile-img" data-user-photo alt="Profile photo" src="" width="86" height="86" fetchpriority="high" decoding="sync">
                    </button>
                </div>
                <div class="wf-profile-table">
                    <div class="wf-profile-label">Name</div>
                    <div class="wf-profile-value" data-user-name></div>
                    <div class="wf-profile-label" data-hide-if-no-dob>Dob</div>
                    <div class="wf-profile-value" data-hide-if-no-dob data-user-dob></div>
                    <div class="wf-profile-label" data-show-if-age style="display:none;">Age</div>
                    <div class="wf-profile-value" data-show-if-age data-user-age style="display:none;"></div>
                    <div class="wf-profile-label" data-show-if-sex style="display:none;">Sex</div>
                    <div class="wf-profile-value" data-show-if-sex data-user-sex style="display:none;"></div>
                    <div class="wf-profile-label" data-show-if-relationship style="display:none;">Relationship status</div>
                    <div class="wf-profile-value" data-show-if-relationship data-user-relationship style="display:none;"></div>
                    <div class="wf-profile-label" data-hide-if-no-address>Address</div>
                    <div class="wf-profile-value" data-hide-if-no-address data-user-address></div>
                    <div class="wf-profile-label">State</div>
                    <div class="wf-profile-value" data-user-state></div>
                    <div class="wf-profile-label" data-hide-if-no-address>Zip code</div>
                    <div class="wf-profile-value" data-hide-if-no-address data-user-zip></div>
                    <div class="wf-profile-label">Email</div>
                    <div class="wf-profile-value" data-user-email></div>
                    <div class="wf-profile-label" data-hide-if-no-phone>Phone Number</div>
                    <div class="wf-profile-value wf-link" data-hide-if-no-phone data-user-phone></div>
                    <div class="wf-profile-label" data-show-if-account-details style="display:none;">Account number</div>
                    <div class="wf-profile-value wf-copy-row" data-show-if-account-details style="display:none;">
                        <button type="button" class="wf-copy-btn" data-copy-from="data-user-account-number" aria-label="Copy account number">
                            <span data-user-account-number></span>
                            <i class="fa-regular fa-copy" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="wf-profile-label" data-show-if-account-details style="display:none;">Routing number</div>
                    <div class="wf-profile-value wf-copy-row" data-show-if-account-details style="display:none;">
                        <button type="button" class="wf-copy-btn" data-copy-from="data-user-routing-number" aria-label="Copy routing number">
                            <span data-user-routing-number></span>
                            <i class="fa-regular fa-copy" aria-hidden="true"></i>
                        </button>
                    </div>

                    <div class="wf-profile-label wf-profile-section-label">Cards</div>
                    <div class="wf-profile-cards">
                        <div class="wf-profile-card-row">
                            <div class="wf-profile-card-name">Platinum Debit Card</div>
                            <div class="wf-profile-card-number"><span class="wf-mask">****&nbsp;&nbsp;****&nbsp;&nbsp;****</span><span class="wf-last4">2974</span></div>
                        </div>
                        <div class="wf-profile-card-row">
                            <div class="wf-profile-card-name">Wells Fargo Credit Card</div>
                            <div class="wf-profile-card-number"><span class="wf-mask">****&nbsp;&nbsp;****&nbsp;&nbsp;****</span><span class="wf-last4">3946</span></div>
                        </div>
                        <div class="wf-profile-card-row" data-hide-if-no-spending>
                            <div class="wf-profile-card-name" data-user-spending-name></div>
                            <div class="wf-profile-card-number"><span class="wf-mask">****&nbsp;&nbsp;****&nbsp;&nbsp;****</span><span class="wf-last4">0273</span></div>
                        </div>
                    </div>
                </div>

                <div class="wf-profile-footer">
                    <a class="wf-logout" href="index.html" onclick="if (window.wfAuth && window.wfAuth.logout) { event.preventDefault(); window.wfAuth.logout(); }">Logout</a>
                    <div class="wf-since" data-user-since></div>
                </div>
            </div>
        </main>

        <nav class="wf-tabbar" aria-label="Primary">
            <a class="wf-tab" href="dashboard.html">
                <svg class="wf-tab-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3 3 10.5v9.5c0 .6.4 1 1 1h6v-7h4v7h6c.6 0 1-.4 1-1v-9.5L12 3Z" fill="currentColor"/>
                </svg>
                <span>Home</span>
            </a>
            <a class="wf-tab" href="card.html">
                <svg class="wf-tab-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 6h16a2 2 0 0 1 2 2v2H2V8a2 2 0 0 1 2-2Zm-2 6h20v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6Z" fill="currentColor"/>
                </svg>
                <span>Card</span>
            </a>
            <a class="wf-tab" href="transfer.html">
                <svg class="wf-tab-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 7h10l-2-2 1.4-1.4L21 7l-4.6 4.4L15 10l2-2H7V7Zm10 10H7l2 2-1.4 1.4L3 17l4.6-4.4L9 14l-2 2h10v1Z" fill="currentColor"/>
                </svg>
                <span>Transfer</span>
            </a>
            <a class="wf-tab" href="history.html">
                <svg class="wf-tab-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="6.5" y="4.5" width="11" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M9 9h6M9 13h6M9 17h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>History</span>
            </a>
            <a class="wf-tab active" href="profile.html" aria-current="page">
                <svg class="wf-tab-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12Zm0 2c-4.4 0-8 2.3-8 5v2h16v-2c0-2.7-3.6-5-8-5Z" fill="currentColor"/>
                </svg>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <div id="photoLightbox" class="wf-photo-lightbox" style="display:none;" hidden>
        <button type="button" class="wf-photo-lightbox-close" id="photoLightboxClose" aria-label="Close">×</button>
        <img id="photoLightboxImg" class="wf-photo-lightbox-img" alt="Profile photo">
    </div>

    <script>
        document.addEventListener('click', async (event) => {
            const btn = event.target.closest('.wf-copy-btn');
            if (!btn) return;

            const attr = btn.getAttribute('data-copy-from');
            const valueEl = attr ? btn.querySelector('[' + attr + ']') : null;
            const text = (valueEl?.textContent || '').trim();
            if (!text) return;

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const input = document.createElement('textarea');
                    input.value = text;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    input.remove();
                }
                btn.classList.add('is-copied');
                const icon = btn.querySelector('i');
                if (icon) {
                    icon.className = 'fa-solid fa-check';
                }
                window.setTimeout(() => {
                    btn.classList.remove('is-copied');
                    if (icon) icon.className = 'fa-regular fa-copy';
                }, 1200);
            } catch (err) {
                // ignore
            }
        });

        (function () {
            const openBtn = document.getElementById('profilePhotoBtn');
            const lightbox = document.getElementById('photoLightbox');
            const lightboxImg = document.getElementById('photoLightboxImg');
            const closeBtn = document.getElementById('photoLightboxClose');
            const profileImg = openBtn ? openBtn.querySelector('[data-user-photo]') : null;
            if (!openBtn || !lightbox || !lightboxImg || !closeBtn || !profileImg) return;

            function openPhoto() {
                lightboxImg.src = profileImg.getAttribute('src') || '';
                lightboxImg.alt = profileImg.getAttribute('alt') || 'Profile photo';
                lightbox.hidden = false;
                lightbox.style.display = 'flex';
            }

            function closePhoto() {
                lightbox.style.display = 'none';
                lightbox.hidden = true;
                lightboxImg.removeAttribute('src');
            }

            openBtn.addEventListener('click', openPhoto);
            closeBtn.addEventListener('click', closePhoto);
            lightbox.addEventListener('click', (event) => {
                if (event.target === lightbox) closePhoto();
            });
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && lightbox.style.display === 'flex') closePhoto();
            });
        })();
    </script>
</body>
</html>
